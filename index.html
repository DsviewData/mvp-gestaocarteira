<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSViewData - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1a1f2e;
            --bg-secondary: #242a3d;
            --bg-card: #2a3148;
            --text-primary: #ffffff;
            --text-secondary: #a0a8c0;
            --accent-yellow: #fbbf24;
            --accent-orange: #f97316;
            --border-color: #3d4560;
            --error-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0f1219 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Efeito de fundo animado */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -250px;
            right: -250px;
            animation: pulse 4s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
            animation: pulse 5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .login-container {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(251, 191, 36, 0.3);
        }

        .logo-text {
            text-align: center;
        }

        .logo-text h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #fff 0%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            font-weight: 500;
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 32px;
        }

        .welcome-text h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .welcome-text p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-yellow);
            background: var(--bg-primary);
        }

        .form-input::placeholder {
            color: #5a6178;
        }

        .error-message {
            display: none;
            margin-top: 12px;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: var(--error-red);
            font-size: 14px;
            text-align: center;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border: none;
            border-radius: 12px;
            color: #1a1f2e;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.3);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(251, 191, 36, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .demo-credentials {
            margin-top: 32px;
            padding: 20px;
            background: rgba(251, 191, 36, 0.05);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 12px;
        }

        .demo-credentials h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-yellow);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .demo-credentials p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-family: 'Courier New', monospace;
        }

        .demo-credentials strong {
            color: var(--text-primary);
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #5a6178;
        }

        .footer-text a {
            color: var(--accent-yellow);
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }

            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }

            .logo-text h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <div class="logo-icon">📊</div>
            <div class="logo-text">
                <h1>DSViewData</h1>
                <p>ANALYTICS PLATFORM</p>
            </div>
        </div>

        <div class="welcome-text">
            <h2>Bem-vindo de volta!</h2>
            <p>Faça login para acessar seus dashboards e análises</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Usuário</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>
            </div>

            <div class="error-message" id="errorMessage">
                ❌ Usuário ou senha incorretos. Tente novamente.
            </div>

            <button type="submit" class="login-button" id="loginButton">
                Acessar Dashboard
            </button>
        </form>

        <div class="demo-credentials">
            <h3>🎯 Credenciais de Demonstração</h3>
            <p><strong>Usuário:</strong> admin</p>
            <p><strong>Senha:</strong> dsview2024</p>
        </div>

        <div class="footer-text">
            © 2024 DSView Consultoria | <a href="#">Precisa de ajuda?</a>
        </div>
    </div>

    <script>
        // Credenciais padrão
        const DEFAULT_USER = 'admin';
        const DEFAULT_PASS = 'dsview2024';

        // Verificar se já está logado
        if (localStorage.getItem('dsview_logged_in') === 'true') {
            window.location.href = 'dashboard.html';
        }

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginButton = document.getElementById('loginButton');

            // Remover mensagem de erro anterior
            errorMessage.classList.remove('show');

            // Validar credenciais
            if (username === DEFAULT_USER && password === DEFAULT_PASS) {
                // Login bem-sucedido
                loginButton.disabled = true;
                loginButton.textContent = '✓ Autenticado! Redirecionando...';
                
                // Salvar estado de login
                localStorage.setItem('dsview_logged_in', 'true');
                localStorage.setItem('dsview_username', username);
                localStorage.setItem('dsview_login_time', new Date().toISOString());

                // Redirecionar após pequeno delay
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } else {
                // Login falhou
                errorMessage.classList.add('show');
                
                // Limpar senha
                document.getElementById('password').value = '';
                document.getElementById('password').focus();

                // Shake nos inputs
                document.querySelectorAll('.form-input').forEach(input => {
                    input.style.borderColor = 'var(--error-red)';
                    setTimeout(() => {
                        input.style.borderColor = '';
                    }, 1000);
                });
            }
        }

        // Permitir login com Enter
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleLogin(e);
            }
        });

        // Auto-focus no campo de usuário
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
